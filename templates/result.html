<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/style.css">
    <script src="../static/result.js"></script>
    <title>Tes Résultats</title>
</head>
<body>
    <main class="container">

        <header class="header">
            <div>
                <h1>Résultats du quiz</h1>
                <p class="subtitle">{{ title }}</p>
            </div>
            <span class="trophy">🏆</span>
        </header>

        <section class="score-card">
            <p class="score-label">Ton score</p>

            <h2><span id="score">{{ correct }}</span> <span> / <span id="total">{{ total }}</span></span></h2>

            <p class="percentage" id="percentage">{{ correct/total * 100 }} % de réussite</p>

            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>

            <p class="message" id="message">Excellent travail ! 🎉</p>
        </section>



        <section class="stats">
            <div class="stat-card">
                <span class="icon success">✓</span>
                <h3 id="bonnes-reponses">8</h3>
                <p>Bonnes réponses</p>
            </div>

            <div class="stat-card">
                <span class="icon error">✕</span>
                <h3 id="mauvaises-reponses">2</h3>
                <p>Mauvaises réponses</p>
            </div>
        </section>
        


        <a href="/" class="restart">
            🏠🏠😱🏠🏠
        </a>

    </main>


<script defer>init({{ correct }}, {{ total }})</script>
</body>
</html>
