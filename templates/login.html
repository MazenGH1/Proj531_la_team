<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styles/login.css">
    <title>Login a votre compte</title>
</head>
<body>

<div class="container">

    <header class="header">
        <div>
            <h1>Bienvenue !</h1>
            <p class="subtitle">Connecte-toi pour retrouver tes quiz.</p>
        </div>
        <div class="trophy">🏆</div>
    </header>

    <div class="auth-card">

        <h2>Se connecter</h2>
        <p class="form-subtitle">Ravi de te revoir !</p>

        <form id="loginForm" action="/login" method="POST">

            <label for="username">Nom d'utilisateur</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Ton pseudo"
                minlength="3"
                required
            >

            <label for="password">Mot de passe</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ton mot de passe"
                required
            >

            <button type="submit" class="submit-btn">
                Se connecter
            </button>

        </form>

        <p class="switch-text">
            Pas encore de compte ?
            <a href="cree">Créer un compte</a>
        </p>

        <p id="message" class="message"></p>

    </div>

    <a href="/" class="back-link">← Retour à l'accueil</a>

</div>

<script src="js/connexion.js"></script>

</body>
</html>

</body>
</html>
