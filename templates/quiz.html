<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/style.css">
    <title>Quizz de folie</title>
</head>
<body>
    <div class="quiz-container">

        <!-- Question + Illustration -->
        <div class="question-zone">

            <h1 class="question">
                Quels est la meilleure école du réseau Polytech ?
            </h1>

            <img
                src="../static/Polytech.png"
                alt="Illustration"
                class="question-image"
            >

        </div>

        <!-- Réponses -->
        <div class="answers-zone">

            <button class="answer">A. Annecy</button>

            <button class="answer">B. Grenoble</button>

            <button class="answer">C. Clermont-Ferrand</button>

            <button class="answer"> D. Chambéry</button>

    


        </div>

    </div>
   
</body>
</html>
